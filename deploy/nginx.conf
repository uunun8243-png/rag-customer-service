# RAG 问答服务 Nginx 配置
# 放置到 /etc/nginx/conf.d/rag.conf 后执行：nginx -t && systemctl reload nginx

upstream rag_backend {
    server 127.0.0.1:8000;      # gunicorn/uvicorn 监听地址（与 gunicorn.conf.py 的 bind 一致）
    keepalive 32;
}

# 按客户端 IP 限流（10 req/s，突发 20）
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=10r/s;

server {
    listen 80;
    server_name your-domain.example.com;

    # 请求体大小限制（防超大 body；应用层另有 MAX_QUESTION_LEN）
    client_max_body_size 64k;

    # ---- API / SSE：关闭缓冲，逐帧透传 ----
    location /api/ {
        limit_req zone=rag_api burst=20 nodelay;

        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;   # 透传 Bearer 鉴权头
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";       # 关掉逐请求 keep-alive，避免 SSE 断流

        proxy_buffering off;                  # SSE 关键：不缓冲
        proxy_cache off;
        proxy_read_timeout 300s;              # 生成回答期间不超时
        proxy_send_timeout 300s;
    }

    # ---- 静态页 / healthz / 其它 ----
    location / {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

